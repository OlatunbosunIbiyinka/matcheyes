name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=matcheyes --cov=matcheyes_synth --cov-report=term-missing
      - name: Wheel excludes hidden ground truth
        run: |
          uv build --wheel
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          leaked = [n for n in names if n.startswith(("matcheyes_synth/", "matcheyes_eval/"))]
          assert not leaked, leaked
          print(f"wheel OK: {len(names)} files, no hidden packages")
          EOF
