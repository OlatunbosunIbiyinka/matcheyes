[project]
name = "matcheyes"
version = "0.0.1"
description = "MatchEyes — See beyond the score. An explainable football intelligence engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Olatunbosun Ibiyinka" }]
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Only for MATCHEYES_LLM_AUTH=entra (Microsoft Entra ID tokens); imported solely by
# matcheyes.agents.entra. The engine and the public web surface never need it.
azure = ["azure-identity>=1.19"]

[project.scripts]
matcheyes = "matcheyes.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the inference engine ships. The synthetic generator and evaluation packages live in
# src/ for development but are never part of the deployable artefact (ADR-0005).
packages = ["src/matcheyes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "TID",      # tidy imports
    "RUF",
]

ignore = [
    "S105",     # flags football vocabulary ("PASS_...") as hard-coded passwords
]

[tool.ruff.lint.isort]
known-first-party = ["matcheyes", "matcheyes_synth", "matcheyes_eval", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports keep layer dependencies visible to tests/architecture.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib".msg = "Dynamic imports hide dependencies from the truth-separation checks (ADR-0005)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TID251"]
"src/matcheyes_synth/**" = ["TID251"]
"src/matcheyes_eval/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["matcheyes", "matcheyes_synth", "matcheyes_eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The optional `azure` extra is not installed in the default environment.
module = ["azure", "azure.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external services (Azure, model endpoints); skipped by default in CI",
    "slow: multi-seed statistical checks of the synthetic generator (run in CI; deselect locally with -m 'not slow')",
]
